<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery - Kapenguria School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.imgur.com/tyjm8K4.png">
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      cursor: pointer;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 8px;
    }
    .lightbox:target {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header>
    <nav aria-label="Main navigation">
      <a href="index.html" class="logo">Kapenguria School</a>
      <button class="menu-toggle" type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="main-menu">☰</button>
      <ul class="nav-links" id="main-menu">
        <li><a href="index.html">Home</a></li>

        <li><a href="academics.html">Academics</a></li>
        <li><a href="co-curricular.html">Co-Curricular</a></li>
        <li><a href="students.html">Students’ Arena</a></li>
        <li><a href="admissions.html">Admissions</a></li>
        <li><a href="rules.html">School Rules</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="slides">
      <img src="https://i.imgur.com/YvYEh6N.jpg" alt="Gallery Hero" class="active">
      <img src="https://i.imgur.com/edsDFaW.jpg" alt="School Life">
    </div>

      <h1>Gallery</h1>

  <!-- Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const menuToggle = document.querySelector(".menu-toggle");
      const navLinks = document.querySelector(".nav-links");
      const mobileBreakpoint = 768;

      menuToggle.addEventListener("click", function () {
        const isOpen = navLinks.classList.toggle("active");
        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.textContent = isOpen ? "✕" : "☰";
      });

      const slides = document.querySelectorAll(".slides img");
      let current = 0;
      function showSlide(index) {
        slides.forEach((img, i) => img.classList.toggle("active", i === index));
      }
      if (slides.length > 1) {
        setInterval(() => {
          current = (current + 1) % slides.length;
          showSlide(current);
        }, 4000);
      }
    });
  </script>
