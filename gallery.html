<!DOCTYPE html>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="academics.html">Academics</a></li>
        <li><a href="co-curricular.html">Co-Curricular</a></li>
        <li><a href="students.html">Students’ Arena</a></li>
        <li><a href="admissions.html">Admissions</a></li>
        <li><a href="rules.html">School Rules</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="slides">
      <img src="https://i.imgur.com/YvYEh6N.jpg" alt="Gallery Hero" class="active">
      <img src="https://i.imgur.com/edsDFaW.jpg" alt="School Life">
    </div>
    <div class="hero-text">
      <h1>Gallery</h1>
      <p>Snapshots of life at Kapenguria School</p>
    </div>
  </section>

  <!-- Gallery Section -->
  <section class="gallery">
    <img src="https://i.imgur.com/YvYEh6N.jpg" alt="School Assembly">
    <img src="https://i.imgur.com/edsDFaW.jpg" alt="Classroom Learning">
    <img src="https://i.imgur.com/45P4QUM.jpg" alt="Sports Day">
    <img src="https://i.imgur.com/kmzdeGC.jpg" alt="Science Congress">
    <img src="https://i.imgur.com/mYP77Ng.jpg" alt="Debate Club">
    <img src="https://i.imgur.com/2VDBtSK.jpg" alt="Drama Festival">

  </footer>

  <!-- Slideshow Script -->
  <script>
    let current = 0;
    const slides = document.querySelectorAll('.slides img');
    function showSlide(index) {
      slides.forEach((img, i) => {
        img.classList.remove('active');
        if (i === index) img.classList.add('active');
      });
    }
    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }
    setInterval(nextSlide, 4000);
  </script>
</body>
